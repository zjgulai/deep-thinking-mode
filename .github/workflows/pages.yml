name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Verify single Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          test "$mode" = workflow

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run checks
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify no site drift
        run: git diff --exit-code -- site docs

      - name: Check public artifact
        run: npm run check:public

      - name: Check public manifest drift
        run: npm run manifest:check

      - name: Check public tree
        run: node tools/check-public-tree.mjs --git-ref HEAD --manifest tools/config/public-paths.json

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
